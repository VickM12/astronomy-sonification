<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Harmonia Mundi: a Sun, three orbits, and a planet written as a note on the outer one. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e0c17a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e0c17a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#07090e"/>
  <g transform="rotate(-20 32 34)" fill="none" stroke="#93a4b8" stroke-width="1.7">
    <ellipse cx="32" cy="34" rx="11" ry="6" opacity="0.55"/>
    <ellipse cx="32" cy="34" rx="18.5" ry="10" opacity="0.75"/>
    <ellipse cx="32" cy="34" rx="26" ry="14" opacity="0.95"/>
  </g>
  <circle cx="32" cy="34" r="12" fill="url(#glow)"/>
  <circle cx="32" cy="34" r="5.2" fill="#e0c17a"/>
  <!-- Planet on the outer orbit, drawn as a notehead with a stem. -->
  <g transform="translate(50.5 20.5)">
    <line x1="4.1" y1="-1.2" x2="4.1" y2="-15.5" stroke="#e7eef8" stroke-width="1.8" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="4.8" ry="3.5" fill="#e7eef8" transform="rotate(-20)"/>
  </g>
</svg>
